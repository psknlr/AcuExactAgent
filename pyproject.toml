[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acuexact-agent"
version = "0.2.0"
description = "Evidence-preserving quotation extraction and auditable relevance classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pdfplumber==0.11.9", "pypdf==6.10.0", "openpyxl==3.1.5", "jsonschema==4.26.0"]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13,<0.4"]

[project.scripts]
acuexact = "acuexact.cli:main"

[tool.setuptools.package-data]
acuexact = ["static/*.html", "data/*.json"]

[tool.setuptools.packages.find]
include = ["acuexact*"]
